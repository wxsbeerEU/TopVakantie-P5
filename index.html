<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P5 - TopVakantie</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        
        <!-- HOOFDSCHERM -->
        <section id="main-menu" class="view active">
            <h1 class="page-title">P5 - TopVakantie</h1>
            
            <div class="menu-list">
                <button class="menu-btn" id="btn-dagplanning">
                    <span>Dagplanning</span>
                    <span>→</span>
                </button>
                
                <button class="menu-btn" id="btn-game">
                    <span>Kamp Game</span>
                    <span>→</span>
                </button>
            </div>
        </section>

        <!-- DAGPLANNING SCHERM -->
        <section id="schedule-view" class="view">
            <div class="view-header">
                <button class="btn-back" id="btn-back-schedule">← Terug</button>
                <h1 class="page-title">Dagplanning</h1>
            </div>
            
            <div class="live-panel">
                <div class="panel-row">
                    <span class="panel-label">HUIDIGE TIJD:</span>
                    <span id="currentTime" class="panel-value">00:00:00</span>
                </div>
                <div class="panel-row">
                    <span class="panel-label">HUIDIGE ACTIVITEIT:</span>
                    <strong id="currentActivity" class="panel-value">-</strong>
                </div>
                <div class="panel-row">
                    <span class="panel-label">PERIODE:</span>
                    <span class="panel-value"><span id="currentActivityFrom">00:00</span> tot <span id="currentActivityTo">00:00</span></span>
                </div>
            </div>

            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Tijd</th>
                        <th>Activiteit</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </section>

        <!-- GAME SCHERM -->
        <section id="game-view" class="view">
            <div class="view-header">
                <button class="btn-back" id="btn-back-game">← Terug</button>
                <h1 class="page-title">Kamp Game</h1>
            </div>
            <div class="game-container">
                <p>Hier komt de game.</p>
            </div>
        </section>

    </div>

    <script type="module" src="./script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('ServiceWorker actief'))
                .catch(err => console.error('ServiceWorker fout', err));
        }
    </script>
</body>
</html>
