<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamp Controlepaneel</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="app-container">
        
        <section id="home-view" class="view">
            <h1 class="page-title">Kamp Navigatie</h1>
            <nav class="menu-list">
                <button id="btn-to-schedule" class="nav-button">1. Dagplanning openen</button>
                <button id="btn-to-game" class="nav-button">2. Kampspel openen</button>
            </nav>
        </section>

        <section id="schedule-view" class="view hidden">
            <div class="navigation-bar">
                <button class="back-link" id="btn-back-from-schedule">&larr; Terug naar hoofdmenu</button>
            </div>
            
            <div class="live-panel">
                <div class="panel-row">
                    <span class="panel-label">HUIDIGE TIJD:</span>
                    <span id="currentTime" class="panel-value">00:00:00</span>
                </div>
                <div class="panel-row">
                    <span class="panel-label">HUIDIGE ACTIVITEIT:</span>
                    <strong id="currentActivity" class="panel-value">-</strong>
                </div>
                <div class="panel-row">
                    <span class="panel-label">PERIODE:</span>
                    <span class="panel-value"><span id="currentActivityFrom">00:00</span> tot <span id="currentActivityTo">00:00</span></span>
                </div>
            </div>

            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Tijd</th>
                        <th>Activiteit</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>

        <section id="game-view" class="view hidden">
            <div class="navigation-bar">
                <button class="back-link" id="btn-back-from-game">&larr; Terug naar hoofdmenu</button>
            </div>
            
            <h2 class="page-title">Kampspel: De Rebus Jacht</h2>

            <div id="game-login-panel" class="live-panel">
                <p>Voer de naam van je team in om deel te nemen aan het spel:</p>
                <div style="margin-top: 10px;">
                    <input type="text" id="input-team-name" placeholder="bv. De Turbo Tijgers" style="padding: 10px; width: 65%; border: 1px solid #000000; font-family: inherit;">
                    <button id="btn-save-team" class="nav-button" style="padding: 10px 15px; display: inline-block; font-size: 0.9rem;">Starten</button>
                </div>
            </div>

            <div id="game-play-panel" class="live-panel hidden">
                <p>Ingelogd als: <strong id="display-team-name">-</strong></p>
                <hr style="border: 0; border-top: 1px solid #cccccc; margin: 15px 0;">
                <p><strong>Rebus opgelost?</strong> Voer hieronder je antwoord in:</p>
                <div style="margin-top: 10px; display: flex; gap: 10px;">
                    <input type="text" id="input-rebus-answer" placeholder="Antwoord..." style="padding: 10px; flex-grow: 1; border: 1px solid #000000; font-family: inherit;">
                    <button id="btn-submit-answer" class="nav-button" style="padding: 10px 15px; font-size: 0.9rem;">Insturen</button>
                </div>
                <p id="game-feedback" style="margin-top: 8px; font-weight: bold; font-size: 0.9rem;"></p>
            </div>

            <h2 class="page-title" style="margin-top: 20px;">Tussenstand</h2>
            <table id="scoreboard-table">
                <thead>
                    <tr>
                        <th>Team</th>
                        <th style="width: 80px; text-align: center;">Punten</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>

    </div>

    <script type="module" src="./script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('ServiceWorker actief'))
                .catch(err => console.error('ServiceWorker fout', err));
        }
    </script>
</body>
</html>
