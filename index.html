<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagschema</title>
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main class="app-container">
        <section class="status-card">
            <div class="time-header">
                <span class="label">Huidige tijd</span>
                <span id="currentTime" class="time-value">00:00:00</span>
            </div>
            
            <div class="activity-details">
                <h1 id="currentActivity" class="activity-title">Laden...</h1>
                <p class="activity-window">
                    <span id="currentActivityFrom">00:00</span> &mdash; <span id="currentActivityTo">00:00</span>
                </p>
            </div>
        </section>

        <section class="schedule-section">
            <table id="schedule-table">
                <thead>
                    <tr>
                        <th>Tijd</th>
                        <th>Activiteit</th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </section>
    </main>

    <script src="./script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js')
                .then(registration => console.log('ServiceWorker geregistreerd:', registration.scope))
                .catch(error => console.error('ServiceWorker registratie mislukt:', error));
        }
    </script>
</body>
</html>
